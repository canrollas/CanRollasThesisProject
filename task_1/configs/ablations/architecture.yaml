# Architecture comparison: full cross of 5 decoders x 4 encoders = 20
# combinations, minus 2 that SMP rejects outright (UnetPlusPlus does not
# support any MiT encoder -- the source paper notes this same
# incompatibility -- so unetplusplus+mit_b2 and unetplusplus+mit_b1 are
# excluded). All 18 remaining pairs verified with check_compatibility.py
# (forward pass, no training) before being listed here.
#
# Decoders: unet, unetplusplus, fpn, manet, segformer
# Encoders: mit_b2, resnet50, densenet121, mit_b1
# Weights: always ImageNet (no SSL/SWSL in this study).
cases:
  - overrides: {model.decoder: unet, model.encoder: mit_b2}
  - overrides: {model.decoder: unet, model.encoder: resnet50}
  - overrides: {model.decoder: unet, model.encoder: densenet121}
  - overrides: {model.decoder: unet, model.encoder: mit_b1}
  - overrides: {model.decoder: unetplusplus, model.encoder: resnet50}
  - overrides: {model.decoder: unetplusplus, model.encoder: densenet121}
  - overrides: {model.decoder: fpn, model.encoder: mit_b2}
  - overrides: {model.decoder: fpn, model.encoder: resnet50}
  - overrides: {model.decoder: fpn, model.encoder: densenet121}
  - overrides: {model.decoder: fpn, model.encoder: mit_b1}
  - overrides: {model.decoder: manet, model.encoder: mit_b2}
  - overrides: {model.decoder: manet, model.encoder: resnet50}
  - overrides: {model.decoder: manet, model.encoder: densenet121}
  - overrides: {model.decoder: manet, model.encoder: mit_b1}
  - overrides: {model.decoder: segformer, model.encoder: mit_b2}
  - overrides: {model.decoder: segformer, model.encoder: resnet50}
  - overrides: {model.decoder: segformer, model.encoder: densenet121}
  - overrides: {model.decoder: segformer, model.encoder: mit_b1}
