# Backbone ablation: decoder=unet, weights=imagenet (BASE) held fixed,
# only the encoder backbone varies. Trimmed from the source paper's 12
# backbones to 7 under a 1-month thesis deadline, keeping every choice
# that the paper's own results (Table 4/5) make load-bearing:
#   - mit_b1, mit_b2: MiT (transformer) encoders dominate every result in
#     the paper regardless of decoder; mit_b2 is the single best backbone
#     overall. mit_b3 dropped (b1/b2 already show the trend, most
#     expensive MiT variant, diminishing returns).
#   - densenet121: surprisingly strong -- 2nd-best individual region
#     result (U-Net+++DenseNet-121 = 0.8998 mIoU, ~tied with the best),
#     and 2nd-best family mean IoU in tissue segmentation, ahead of
#     ResNet. Too load-bearing a finding to cut.
#   - resnet34: BASE anchor, also the fixed encoder for decoder.yaml.
#   - resnet50: needed anyway for weights.yaml (SSL/SWSL only exist for
#     this encoder), also a solid mid-tier CNN reference.
#   - efficientnet-b0, mobilenet_v2: cheap, and part of the
#     accuracy/efficiency deployment story from the paper's conclusions.
# Dropped: resnet18 (redundant with resnet34/50), efficientnet-b3/b4
# (paper: this whole family ranks lowest on tissue seg, b0 already
# confirms/tests that), resnext50_32x4d (didn't stand out in the paper).
cases:
  - overrides: {model.encoder: resnet34}
  - overrides: {model.encoder: resnet50}
  - overrides: {model.encoder: densenet121}
  - overrides: {model.encoder: efficientnet-b0}
  - overrides: {model.encoder: mobilenet_v2}
  - overrides: {model.encoder: mit_b1}
  - overrides: {model.encoder: mit_b2}
