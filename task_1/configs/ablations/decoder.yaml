# Decoder ablation: encoder=resnet34, weights=imagenet (BASE) held fixed,
# only the segmentation decoder/architecture varies. resnet34 is used
# because it is compatible with all ten SMP decoders tested here, including
# segformer's lightweight all-MLP decoder head (SMP's smp.Segformer is
# generic over encoders, not restricted to MiT, so it stays consistent
# with this axis's fixed-backbone protocol). Note this only tells you
# whether the MLP decoder head helps with a CNN backbone; it does not by
# itself test the canonical SegFormer pairing (MiT encoder + MLP decoder)
# from the backbone ablation's mit_b1/b2/b3 cases -- ask if you want that
# specific combo added as an extra highlighted case.
cases:
  - overrides: {model.decoder: unet}
  - overrides: {model.decoder: unetplusplus}
  - overrides: {model.decoder: fpn}
  - overrides: {model.decoder: deeplabv3plus}
  - overrides: {model.decoder: manet}
  - overrides: {model.decoder: linknet}
  - overrides: {model.decoder: pan}
  - overrides: {model.decoder: pspnet}
  - overrides: {model.decoder: deeplabv3}
  - overrides: {model.decoder: segformer}
