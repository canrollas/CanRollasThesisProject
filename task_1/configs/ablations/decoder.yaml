# Decoder ablation: encoder=resnet34, weights=imagenet (BASE) held fixed,
# only the segmentation decoder/architecture varies. Trimmed from the
# source paper's 9 decoders (+ our segformer addition) to 6 under a
# 1-month thesis deadline. The paper's own finding is that decoder choice
# barely matters compared to backbone choice (narrow spread: 0.887-0.897
# mIoU region, 0.691-0.710 mIoU tissue across all 9), which makes this
# axis the safest place to cut cases without losing much signal:
#   - unet: standard baseline, most widely used/cited.
#   - unetplusplus: best mean mIoU for region segmentation in the paper.
#   - manet: overall best individual result for tissue segmentation
#     (MA-Net & MiT-B2) in the paper.
#   - deeplabv3plus: common strong baseline elsewhere in segmentation
#     literature, distinct (atrous conv) architecture family.
#   - fpn: weakest mean performer in the paper's region results -- kept
#     as the "floor" reference point for comparison.
#   - segformer: our addition, the genuine all-MLP decoder head (paired
#     with a CNN backbone here; pairing it with mit_b1/b2 specifically is
#     a separate cross-axis combo, ask if you want that added too).
# Dropped: linknet, pan, pspnet, deeplabv3 (plain -- superseded by
# deeplabv3plus here) -- none stood out as notably strong or weak in the
# paper's results.
cases:
  - overrides: {model.decoder: unet}
  - overrides: {model.decoder: unetplusplus}
  - overrides: {model.decoder: manet}
  - overrides: {model.decoder: deeplabv3plus}
  - overrides: {model.decoder: fpn}
  - overrides: {model.decoder: segformer}
