# Combined backbone x decoder verification: unlike every other axis, this
# one varies BOTH model.decoder and model.encoder together, none equal to
# BASE (unet+resnet34). Pure OFAT (this file's sibling studies) never
# actually trains a non-U-Net decoder with a non-ResNet-34 backbone
# together -- this axis closes that gap with real combinations, chosen
# from the source paper's own findings + our trimmed backbone/decoder
# candidate pools (no need to wait for our OFAT results to pick sensible
# pairs):
#   - mit_b2 + segformer: the canonical SegFormer pairing (transformer
#     encoder + its native all-MLP decoder), distinct from segformer's
#     decoder-axis test (which pairs it with resnet34).
#   - mit_b2 + manet: mirrors the paper's actual best tissue-segmentation
#     combo (MA-Net & MiT-B2), applied here to region segmentation.
#   - mit_b1 + fpn: a transformer encoder paired with FPN instead of a
#     CNN (unetplusplus and deeplabv3plus were tried first here but SMP
#     rejects both with mit_b1 -- unetplusplus doesn't support MiT at all,
#     matching the source paper's own noted incompatibility; deeplabv3plus
#     fails on this encoder's feature-map shape).
#   - densenet121 + unetplusplus: this is *exactly* the paper's own
#     2nd-best individual region result (U-Net+++DenseNet-121, 0.8998
#     mIoU, ~tied with their overall best). deeplabv3plus was tried first
#     but SMP rejects it -- DenseNet's pooling-based downsampling can't do
#     the dilated convolutions DeepLabV3+ requires.
#   - mobilenet_v2 + fpn: a lightweight/deployment-oriented combination,
#     distinct in spirit from the four accuracy-oriented ones above.
cases:
  - overrides: {model.decoder: segformer, model.encoder: mit_b2}
  - overrides: {model.decoder: manet, model.encoder: mit_b2}
  - overrides: {model.decoder: fpn, model.encoder: mit_b1}
  - overrides: {model.decoder: unetplusplus, model.encoder: densenet121}
  - overrides: {model.decoder: fpn, model.encoder: mobilenet_v2}
