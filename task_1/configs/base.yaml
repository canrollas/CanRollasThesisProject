data:
  images_dir: ../datasets/wound-region-segmentation/images
  masks_dir: ../datasets/wound-region-segmentation/masks
  color_mapping_path: ../datasets/wound-region-segmentation/color-mappings.json
  classes: [other, skin, wound]
  ignore_index: null
  holdout_fraction: 0.15
  holdout_seed: 123
  n_folds: 3
  val_fraction_of_remaining: 0.1
  split_seed: 42

model:
  decoder: unet
  encoder: resnet34
  weights: imagenet

train:
  loss: ce_dice
  resolution: 224
  augmentation: default
  batch_size: 16
  epochs: 100
  lr: 0.0001
  weight_decay: 0.00001
  lr_min_factor: 0.01
  seed: 42
  train_fraction: 1.0

output:
  results_csv: results/region_results.csv
  checkpoint_dir: checkpoints
  save_checkpoints: true
