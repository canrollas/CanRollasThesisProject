image_size: 256
batch_size: 16

lr: 0.0001
weight_decay: 0.00001
epochs: 100
eta_min_factor: 0.01

loss:
  ce_weight: 0.5
  dice_weight: 0.5

augment:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_p: 0.7
  rotate_angles: [90, 180, 270]

num_folds: 3
val_fraction: 0.1
seed: 42

classes: [background, skin, wound]

checkpoint_dir: checkpoints
results_csv: results/ablation_results.csv
