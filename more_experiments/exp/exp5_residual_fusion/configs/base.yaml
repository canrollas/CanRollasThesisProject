# Experiment 5 -- baseline-preserving residual late fusion (Chapter 8).
#
# z_final = z_rgb + delta_z, where z_rgb comes from the FROZEN, trained
# RGB MiT-B1+CORN baseline (not ImageNet-only, unlike exp-4) and delta_z
# from a small residual MLP whose final layer is zero-initialized -- at
# construction, z_final == z_rgb exactly (verified in
# scripts/test_residual_model.py and again against the real checkpoint in
# scripts/train.py before training starts). Phase 1 trains only the
# tissue CNN + residual head; the RGB branch never updates.
#
# Reuses exp-4's dataset (datasets/wound-staging-masks-exp-3/, same
# leakage-safe tissue predictions, same verified PIID split) and exp-4's
# TissueCNN unchanged.
#
# config_id: mit_b1__corn__residual_latefusion

encoder: mit_b1
weights: imagenet   # only used to build the RGB branch's architecture; its
                     # actual weights are overwritten by the loaded baseline checkpoint

image_size: 224
batch_size: 16

lr: 0.0001
weight_decay: 0.00001
max_epochs: 100
eta_min_factor: 0.01
patience: 10         # early stopping: epochs without val macro_f1 improvement

augment:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_p: 0.7
  rotate_angles: [90, 180, 270]

num_folds: 3
val_fraction: 0.1
seed: 42

classes: [stage_1, stage_2, stage_3, stage_4]

# Paths below resolve relative to exp/exp5_residual_fusion/ (this file's
# grandparent), matching how scripts/train.py loads them.
data_root: ../../../datasets/wound-staging-masks-exp-3
metadata_csv: ../../../datasets/wound-staging-masks-exp-3/metadata.csv

# Per-fold RGB baseline checkpoints -- task_3's own mit_b1__corn config,
# trained unmodified (not a new/different initialization scheme). {fold}
# is substituted with 0/1/2.
rgb_checkpoint_template: ../../../task_3/results/task_3_outputs/checkpoints/mit_b1__corn_fold{fold}.pt

checkpoint_dir: checkpoints
results_csv: results/exp5_results.csv
