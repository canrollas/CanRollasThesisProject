# Experiment 3 -- RGB + 5 tissue-probability channels (Chapter 8).
#
# Same backbone/head/protocol as task_3's best config (mit_b1 + CORN,
# confirmed best in task_3/results/task_3_outputs/results/ablation_summary.csv),
# trained on datasets/wound-staging-masks-exp-3/ (8-channel .npy: full
# uncropped RGB + 5 tissue-class probability channels from Task 2,
# MAnet+MiT-B2, zeroed where no wound was found; see
# scripts/generate_dataset.py). Unlike exp-1/exp-2, RGB is never
# cropped/masked here -- only extra channels are added.
#
# That dataset has the exact same stage_X/<file> layout as
# datasets/wound-stage-classification/ (just .npy instead of .jpg), so
# task_3/src/splits.py's own build_folds() reproduces the ORIGINAL PIID
# 3-fold split assignments exactly (verified directly, not assumed) for a
# paired comparison against Experiment 1A/1B/2.
#
# Model/dataset code is NOT task_3/src's (3-channel, JPEG) -- see
# scripts/model.py and scripts/dataset.py for the 8-channel versions.
# Everything else (engine/losses/metrics/splits/augmentations/utils) is
# reused from task_3/src unchanged.

encoder: mit_b1
head: corn
weights: imagenet
in_channels: 8

image_size: 224
batch_size: 16

lr: 0.0001
weight_decay: 0.00001
epochs: 100
eta_min_factor: 0.01

augment:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_p: 0.7
  rotate_angles: [90, 180, 270]

num_folds: 3
val_fraction: 0.1
seed: 42

classes: [stage_1, stage_2, stage_3, stage_4]

# Paths below resolve relative to exp/exp3_tissue_channels/ (this file's
# grandparent), matching how scripts/train.py loads them -- not relative
# to configs/.
data_root: ../../../datasets/wound-staging-masks-exp-3
metadata_csv: ../../../datasets/wound-staging-masks-exp-3/metadata.csv

checkpoint_dir: checkpoints
results_csv: results/exp3_results.csv
