# Experiment 2 -- staging on wound-only (adaptively dilated) images (Chapter 8).
#
# Same backbone/head/protocol as task_3's best config (mit_b1 + CORN,
# confirmed best in task_3/results/task_3_outputs/results/ablation_summary.csv),
# retrained on datasets/wound-staging-masks-exp-2/ (ensemble-mask: wound
# only kept, skin+background dropped, adaptively grown when small/
# undetected with a base skin margin on every image; see
# scripts/generate_dataset.py) instead of the original full-frame PIID
# photos. That dataset has the exact same layout as
# datasets/wound-stage-classification/, so task_3/src/splits.py's own
# build_folds() reproduces the ORIGINAL PIID 3-fold split assignments
# (same filenames, same seed) for a paired comparison against Experiment 1A
# (task_3's existing results) and Experiment 1B (exp1_wound_crop).

encoder: mit_b1
head: corn
weights: imagenet

image_size: 224
batch_size: 16

lr: 0.0001
weight_decay: 0.00001
epochs: 100
eta_min_factor: 0.01

augment:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_p: 0.7
  rotate_angles: [90, 180, 270]

num_folds: 3
val_fraction: 0.1
seed: 42

classes: [stage_1, stage_2, stage_3, stage_4]

# Paths below resolve relative to exp/exp2_wound_dilated/ (this file's
# grandparent), matching how scripts/train.py loads them -- not relative to
# configs/.
data_root: ../../../datasets/wound-staging-masks-exp-2
metadata_csv: ../../../datasets/wound-staging-masks-exp-2/metadata.csv

checkpoint_dir: checkpoints
results_csv: results/exp2_results.csv
