# Experiment 1C -- crop robustness evaluation (Chapter 8).
#
# Evaluates the Experiment 1B checkpoint (../../exp1_wound_crop/checkpoints/)
# under controlled crop perturbations. No additional training in the initial
# implementation -- this is an eval-only config.
#
# IMPORTANT: every parameter below must be chosen/tuned using train or
# validation data only. Do not touch the staging test fold while selecting
# these ranges.

checkpoint_source: ../../exp1_wound_crop/checkpoints

perturbations:
  shift:
    enabled: true
    max_fraction_of_bbox: TODO   # e.g. 0.1 -- select on val, not test
  scale:
    enabled: true
    range: TODO                  # e.g. [0.8, 1.2] -- select on val, not test
  bbox_noise:
    enabled: true
    iou_floor: TODO               # minimum IoU with the predicted box to still count as "inaccurate but usable"

eval:
  data_root: ../../piid_crops/crops/rgb
  metadata_csv: ../../piid_crops/manifests/crop_metadata.csv
  num_folds: 3
  seed: 42

results_csv: results/exp1c_robustness_results.csv
